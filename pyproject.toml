[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "care-shift-audit"
version = "1.0.0"
description = "30-minute staffing audit for a fictional care facility"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
